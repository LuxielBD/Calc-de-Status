<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calculadora RPG</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">

  <meta name="theme-color" content="#222222">

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

  <div id="app">

    <h1>Calculadora RPG ♥️⬆️</h1>

    <div class="box">

      <label>Nome do Atributo</label>
      <input type="text" id="nome" placeholder="PV, PE, MN...">

      <label>Valor Inicial</label>
      <input type="number" id="inicial">

      <label>Valor por Nível</label>
      <input type="number" id="porNivel">

      <label>Nível Náximo</label>
      <input type="number" id="nivelMax">

      <button id="calcular">Calcular</button>

    </div>

    <div id="resultado"></div>

  </div>

  <script src="script.js"></script>

</body>
</html>
